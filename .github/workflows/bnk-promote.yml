name: BNK promote

# Operational entry point. One workflow to deploy or verify BNK in any environment, with the
# guardrails an operations team actually needs: an enforced order, human approval before staging
# and production, a server side dry run first, and a scheduled drift check.
#
# Set up once, in Settings then Environments, one GitHub Environment per name below:
#   bnk-lab         no reviewers
#   bnk-demo        no reviewers
#   bnk-staging     required reviewers
#   bnk-production  required reviewers, and a wait timer if you want one
#
# Per environment secrets:
#   FAR_PULL_B64     contents of cne_pull_64.json
#   BNK_LICENSE_JWT  licence token for that environment
#   KUBECONFIG_B64   base64 kubeconfig for that cluster

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [lab, demo, staging, production]
      action:
        description: 'What to do'
        required: true
        default: 'plan'
        type: choice
        options: [plan, apply, verify, uninstall]
      profile:
        description: 'Override the profile, blank uses the environment default'
        required: false
        type: choice
        options: ['', host, dpu]
  schedule:
    # Daily drift check against every long lived environment.
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.pick.outputs.targets }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo 'targets=["staging","production"]' >> "$GITHUB_OUTPUT"
          else
            echo 'targets=["${{ inputs.environment }}"]' >> "$GITHUB_OUTPUT"
          fi

  run:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.resolve.outputs.targets) }}
    runs-on: ubuntu-latest
    environment: bnk-${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4

      - name: tools
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          kubectl version --client

      - name: kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          [ -n "$KUBECONFIG_B64" ] || { echo "KUBECONFIG_B64 not set for bnk-${{ matrix.env }}"; exit 1; }
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl cluster-info

      - name: pull credentials
        env:
          FAR_PULL_B64: ${{ secrets.FAR_PULL_B64 }}
        run: |
          printf '%s' "$FAR_PULL_B64" > "$RUNNER_TEMP/far.json"
          chmod 600 "$RUNNER_TEMP/far.json"

      - name: plan, always runs first
        env:
          FAR_PULL_JSON: ${{ runner.temp }}/far.json
        run: |
          ./install.sh --env ${{ matrix.env }} \
            ${{ inputs.profile && format('--profile {0}', inputs.profile) || '' }} \
            --dry-run --skip-license

      - name: apply
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
        env:
          FAR_PULL_JSON: ${{ runner.temp }}/far.json
          BNK_LICENSE_JWT: ${{ secrets.BNK_LICENSE_JWT }}
        run: |
          ./install.sh --env ${{ matrix.env }} \
            ${{ inputs.profile && format('--profile {0}', inputs.profile) || '' }}

      - name: verify, also the scheduled drift check
        if: github.event_name == 'schedule' || inputs.action == 'verify' || inputs.action == 'apply'
        env:
          FAR_PULL_JSON: ${{ runner.temp }}/far.json
        run: ./install.sh --env ${{ matrix.env }} --phase 70

      - name: uninstall
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'uninstall'
        run: ./uninstall.sh

      - name: diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide | grep -vE 'Running|Completed' || true
          kubectl get cneinstance -A -o yaml | sed -n '/status:/,$p' | head -60 || true
          kubectl logs -n f5-cne-core deploy/f5-lifecycle-operator --tail=60 || true

      - name: wipe credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/far.json" "$HOME/.kube/config"
