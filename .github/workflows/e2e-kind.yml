name: e2e-kind

# Proves the installer against a throwaway Kubernetes 1.30 cluster with Calico, on a hosted
# runner, then installs a second time to prove idempotency. This is what stops the installer
# rotting, and it needs no self hosted runner and no real cluster.
#
# SCOPE. A GitHub hosted runner has 4 vCPU and the BNK control plane requests more than that in
# total, even at deploymentSize Small, so the pods sit Pending with Insufficient cpu. A full
# install genuinely does not fit here and no configuration makes it.
#
# So this tests phases 00 to 40 plus a server side validation of the CNEInstance, which covers the
# parts most likely to regress: preflight, the Multus before FLO ordering, the certificate
# authority chain, registry access, the pinned FLO and cert-gen versions, and that the rendered
# CNEInstance is accepted by a real API server. It then repeats them to prove idempotency.
#
# Installing the data plane is proven on a real cluster instead, by the plan and apply workflows
# against a registered runner.

on:
  pull_request:
    paths: ['install.sh', 'lib/**', 'profiles/**', 'environments/**', 'versions.env', 'ci/**', '.github/workflows/e2e-kind.yml']
  push:
    branches: [main]
    paths: ['install.sh', 'lib/**', 'profiles/**', 'environments/**', 'versions.env', 'ci/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: load pinned versions
        # GITHUB_ENV takes the whole line as the value, so comments and trailing whitespace have to
        # go or CALICO_VERSION arrives as "v3.29.1    # ..." and the manifest URL breaks.
        run: |
          grep -E '^[A-Z_]+=' versions.env | sed -E 's/[[:space:]]*#.*$//' | sed -E 's/[[:space:]]+$//' >> "$GITHUB_ENV"
          echo "loaded these:"
          grep -E '^[A-Z_]+=' versions.env | sed -E 's/[[:space:]]*#.*$//' | sed -E 's/[[:space:]]+$//'

      - uses: helm/kind-action@v1
        with:
          cluster_name: bnk-e2e
          node_image: kindest/node:v1.30.13
          config: ci/kind.yaml

      - name: Calico
        run: |
          kubectl create -f https://raw.githubusercontent.com/projectcalico/calico/"${CALICO_VERSION}"/manifests/tigera-operator.yaml
          sleep 15
          kubectl create -f ci/calico-installation.yaml
          kubectl wait --for=condition=Ready node --all --timeout=300s
          kubectl taint nodes --all node-role.kubernetes.io/control-plane- || true

      - name: hugepages, then make kubelet rediscover them
        run: |
          sudo sysctl -w vm.nr_hugepages=2048
          docker exec bnk-e2e-control-plane systemctl restart kubelet
          sleep 25
          kubectl get node bnk-e2e-control-plane -o jsonpath='{.status.allocatable.hugepages-2Mi}{"\n"}'

      - name: credentials
        env:
          FAR_PULL_B64: ${{ secrets.FAR_PULL_B64 }}
        run: |
          [ -n "$FAR_PULL_B64" ] || { echo "FAR_PULL_B64 secret not set, cannot reach repo.f5.com"; exit 1; }
          printf '%s' "$FAR_PULL_B64" > "$RUNNER_TEMP/far.json"; chmod 600 "$RUNNER_TEMP/far.json"

      - name: phases 00 to 40, everything that fits on a hosted runner
        env:
          FAR_PULL_JSON: ${{ runner.temp }}/far.json
          BNK_STORAGECLASS: standard
        run: |
          for phase in 00 10 20 30 40; do
            ./install.sh --env lab --profile host --skip-license --phase "$phase"
          done

      - name: the CNEInstance is accepted by a real API server
        env:
          FAR_PULL_JSON: ${{ runner.temp }}/far.json
          BNK_STORAGECLASS: standard
        run: ./install.sh --env lab --profile host --skip-license --phase 50 --dry-run

      - name: run it all again, must be a no op
        env:
          FAR_PULL_JSON: ${{ runner.temp }}/far.json
          BNK_STORAGECLASS: standard
        run: |
          for phase in 00 10 20 30 40; do
            ./install.sh --env lab --profile host --skip-license --phase "$phase"
          done
          ./install.sh --env lab --profile host --skip-license --phase 50 --dry-run

      - name: diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -40 || true
          kubectl logs -n f5-cne-core deploy/f5-lifecycle-operator --tail=80 || true
