name: validate

# Runs on every pull request and every push. Hosted runner, no cluster needed.
# Nothing here can change a cluster, so it is safe on any PR.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: contract tests
        run: ./tests/contract.sh

      - name: lint
        run: |
          # Install the pinned shellcheck rather than the distro one. The distro version differs
          # between a developer box and a runner, and so do its findings.
          # shellcheck disable=SC1091
          . ./versions.env
          curl -sSLo /tmp/sc.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          tar -xf /tmp/sc.tar.xz -C /tmp
          sudo install -m 0755 "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version | grep version:
          ./tests/lint.sh

      - name: actionlint
        run: |
          # shellcheck disable=SC1091
          . ./versions.env
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) \
            "${ACTIONLINT_VERSION#v}"
          ./actionlint -color


      - name: every environment and profile renders to valid yaml
        run: |
          pip install --quiet pyyaml
          fail=0
          for e in $(./install.sh --list-env); do
            for p in $(./install.sh --list-profile); do
              # rendered through tests/render.sh, which calls the same lib/render.sh the installer
              # uses, so this cannot go stale when a placeholder is added
              if ! out=$(./tests/render.sh "$e" "$p" 2>&1); then
                echo "FAIL $e/$p render errored: $out"; fail=1; continue
              fi
              if printf '%s' "$out" | grep -q '__'; then
                echo "FAIL $e/$p leftover placeholder"; fail=1; continue
              fi
              if ! printf '%s' "$out" | python3 -c 'import yaml,sys; yaml.safe_load(sys.stdin)'; then
                echo "FAIL $e/$p invalid yaml"; fail=1; continue
              fi
              echo "ok   $e/$p"
            done
          done
          exit $fail

      - name: cluster inventory is valid and every selector resolves
        run: |
          pip install --quiet pyyaml
          for sel in all env:lab env:demo env:staging env:production profile:host profile:dpu runner:beside runner:hub; do
            SELECT=$sel python3 .github/scripts/plan_clusters.py >/dev/null || exit 1
          done
          echo "inventory valid, all selectors resolve"

      - name: every non-template yaml file parses
        run: |
          pip install --quiet pyyaml
          python3 - <<'EX'
          import glob, sys, yaml
          # profiles/*.yaml are templates carrying __PLACEHOLDER__ lines and are checked by the
          # render step above instead. ci/calico-installation.yaml is multi document.
          files = sorted(set(
              glob.glob('.github/workflows/*.yml') + glob.glob('.github/*.yaml') +
              glob.glob('ci/*.yaml') + glob.glob('clusters/*.yaml') +
              glob.glob('fleet/*.yaml') + glob.glob('bootstrap/*.yml')))
          bad = 0
          for f in files:
              try:
                  list(yaml.safe_load_all(open(f)))
                  print('ok  ', f)
              except Exception as e:
                  print('FAIL', f, e); bad += 1
          sys.exit(1 if bad else 0)
          EX

      - name: mermaid diagrams in the docs actually parse
        run: |
          npm install --silent --no-save mermaid jsdom
          python3 - <<'EX'
          import re, pathlib
          out = pathlib.Path('/tmp/mmd'); out.mkdir(exist_ok=True)
          n = 0
          for md in pathlib.Path('.').rglob('*.md'):
              for i, b in enumerate(re.findall(r'```mermaid\n(.*?)```', md.read_text(), re.S), 1):
                  n += 1
                  (out / f'{md.as_posix().replace("/", "_")}.{i}.mmd').write_text(b)
          print(f'extracted {n} diagram(s)')
          EX
          cat > /tmp/parse.mjs <<'EX'
          import { JSDOM } from 'jsdom';
          import { readFileSync, readdirSync } from 'node:fs';
          const dom = new JSDOM('<!doctype html><body></body>', { pretendToBeVisual: true });
          globalThis.window = dom.window; globalThis.document = dom.window.document;
          Object.defineProperty(globalThis, 'navigator', { value: dom.window.navigator, configurable: true });
          const mermaid = (await import('mermaid')).default;
          mermaid.initialize({ startOnLoad: false, securityLevel: 'loose' });
          let bad = 0;
          for (const f of readdirSync('/tmp/mmd').sort()) {
            try { await mermaid.parse(readFileSync(`/tmp/mmd/${f}`, 'utf8')); console.log(`ok   ${f}`); }
            catch (e) { bad++; console.log(`FAIL ${f}: ${String(e.message || e).split('\n')[0]}`); }
          }
          process.exit(bad ? 1 : 0);
          EX
          node /tmp/parse.mjs

