name: BNK install

# Three jobs. lint always runs. e2e proves the installer against a throwaway Kubernetes 1.30
# cluster with Calico on every change. deploy targets a real cluster and is manual only.
#
# Repository secrets required:
#   FAR_PULL_B64      contents of cne_pull_64.json (it is already base64, paste as is)
#   BNK_LICENSE_JWT   licence token, only needed by the deploy job
#   KUBECONFIG_B64    base64 of a kubeconfig, only needed by the deploy job

on:
  push:
    paths: ['install.sh', 'lib/**', 'profiles/**', 'environments/**', 'versions.env', 'ci/**', '.github/workflows/bnk-install.yml']
  pull_request:
    paths: ['install.sh', 'lib/**', 'profiles/**', 'environments/**', 'versions.env', 'ci/**', '.github/workflows/bnk-install.yml']
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to install'
        required: true
        default: 'kind'
        type: choice
        options: [kind, real-cluster]
      profile:
        description: 'CNEInstance profile'
        required: true
        default: 'host'
        type: choice
        options: [host, dpu]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          # lib/*.sh are sourced, not standalone, so tell shellcheck that
          shellcheck -s bash -e SC1091,SC2034 install.sh uninstall.sh
          shellcheck -s bash -e SC1091,SC2034,SC2154,SC2148 lib/*.sh
      - name: validate profiles are parseable yaml
        run: |
          python3 - <<'PY'
          import glob, re, sys
          for f in glob.glob('profiles/*.yaml'):
              t = open(f).read()
              # placeholders are substituted at install time, swap them so yaml parses
              t = re.sub(r'__[A-Z]+__', 'placeholder', t)
              import yaml; yaml.safe_load(t)
              print('ok', f)
          PY
      - name: every pinned version is a real pin
        run: |
          grep -E '^[A-Z_]+=' versions.env | grep -iE '(latest|main|master)$' \
            && { echo "floating version found in versions.env"; exit 1; } || echo "all versions pinned"

  e2e:
    needs: lint
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'kind'
    steps:
      - uses: actions/checkout@v4
      - name: read pins
        run: cat versions.env >> "$GITHUB_ENV"

      - name: create Kubernetes ${{ env.K8S_MINOR }} cluster without a CNI
        uses: helm/kind-action@v1
        with:
          cluster_name: bnk-e2e
          node_image: kindest/node:v1.30.13
          config: ci/kind.yaml

      - name: install Calico
        run: |
          kubectl create -f https://raw.githubusercontent.com/projectcalico/calico/${CALICO_VERSION}/manifests/tigera-operator.yaml
          sleep 15
          kubectl create -f ci/calico-installation.yaml
          kubectl wait --for=condition=Ready node --all --timeout=300s
          kubectl taint nodes --all node-role.kubernetes.io/control-plane- || true

      - name: allocate hugepages for TMM
        run: sudo sysctl -w vm.nr_hugepages=2048 && grep HugePages_Total /proc/meminfo

      - name: write pull credentials
        env:
          FAR_PULL_B64: ${{ secrets.FAR_PULL_B64 }}
        run: |
          [ -n "$FAR_PULL_B64" ] || { echo "FAR_PULL_B64 secret not set, cannot reach repo.f5.com"; exit 1; }
          printf '%s' "$FAR_PULL_B64" > "$RUNNER_TEMP/cne_pull_64.json"
          chmod 600 "$RUNNER_TEMP/cne_pull_64.json"

      - name: install BNK, host profile, unlicensed
        env:
          FAR_PULL_JSON: ${{ runner.temp }}/cne_pull_64.json
        run: ./install.sh --profile host --skip-license

      - name: diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -40 || true
          kubectl logs -n f5-cne-core deploy/f5-lifecycle-operator --tail=80 || true

      - name: idempotency, a second run must change nothing
        env:
          FAR_PULL_JSON: ${{ runner.temp }}/cne_pull_64.json
        run: ./install.sh --profile host --skip-license

  deploy:
    needs: lint
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'real-cluster'
    environment: bnk-production
    steps:
      - uses: actions/checkout@v4
      - name: kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl cluster-info
      - name: write pull credentials
        env:
          FAR_PULL_B64: ${{ secrets.FAR_PULL_B64 }}
        run: |
          printf '%s' "$FAR_PULL_B64" > "$RUNNER_TEMP/cne_pull_64.json"
          chmod 600 "$RUNNER_TEMP/cne_pull_64.json"
      - name: dry run first, validate everything server side
        env:
          FAR_PULL_JSON: ${{ runner.temp }}/cne_pull_64.json
        run: ./install.sh --profile ${{ inputs.profile }} --dry-run --skip-license
      - name: install
        env:
          FAR_PULL_JSON: ${{ runner.temp }}/cne_pull_64.json
          BNK_LICENSE_JWT: ${{ secrets.BNK_LICENSE_JWT }}
        run: ./install.sh --profile ${{ inputs.profile }}
