name: deploy

# Applies BNK on the host that owns the cluster. Manual dispatch only, because an install is not
# something a merge should trigger by itself. A plan always runs first in the same job, so you
# never apply without having just seen what it would do.

on:
  # Callable by the dispatcher so a fleet wide run reuses exactly this job, rather than a second
  # implementation that can drift from it.
  workflow_call:
    inputs:
      runner_label:   { type: string, required: true }
      environment:    { type: string, required: true }
      profile:        { type: string, required: true }
      action:         { type: string, required: false, default: apply }
      skip_license:   { type: boolean, required: false, default: false }
      cluster_name:   { type: string, required: false, default: "" }
      kube_context:   { type: string, required: false, default: "" }
      storage_class:  { type: string, required: false, default: "" }
      pod_cidr:       { type: string, required: false, default: "" }
    secrets:
      FAR_PULL_B64:     { required: true }
      BNK_LICENSE_JWT:  { required: false }
      HUB_KUBECONFIGS:  { required: false }

  workflow_dispatch:
    inputs:
      runner_label:
        description: "Runner label to target, see fleet/runners.yaml"
        required: true
        default: "lab-1"
      environment:
        description: "Environment"
        required: true
        type: choice
        options: [lab, demo, staging, production]
      profile:
        description: "Deployment profile"
        required: true
        type: choice
        options: [host, dpu]
      action:
        description: "apply installs. uninstall removes BNK and leaves cert-manager, Multus and Calico."
        required: true
        default: apply
        type: choice
        options: [apply, uninstall, plan-only, verify]
      skip_license:
        description: "Install unlicensed. Refused by demo, staging and production."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Never two installs against the same cluster at once. Keyed on the cluster rather than the
  # runner, because a hub runner drives several clusters and they can safely proceed in parallel.
  group: bnk-${{ inputs.cluster_name || inputs.runner_label }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, bnk, "${{ inputs.runner_label }}"]
    environment: bnk-${{ inputs.environment }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Hub runners hold one merged kubeconfig with a context per cluster. Runners that sit beside
      # their cluster already have access and need none of this.
      - name: select the cluster
        env:
          HUB_KUBECONFIGS: ${{ secrets.HUB_KUBECONFIGS }}
          CTX: ${{ inputs.kube_context }}
        run: |
          if [ -n "$HUB_KUBECONFIGS" ]; then
            [ -n "$CTX" ] || { echo "hub runner needs kube_context set for this cluster"; exit 1; }
            mkdir -p "$RUNNER_TEMP/kube"
            printf '%s' "$HUB_KUBECONFIGS" | base64 -d > "$RUNNER_TEMP/kube/config"
            chmod 600 "$RUNNER_TEMP/kube/config"
            echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "$GITHUB_ENV"
            echo "using the hub kubeconfig, context $CTX"
          else
            echo "runner sits beside its cluster, using its own kubectl access"
          fi
          # Export it rather than splicing an argument, so no step relies on word splitting.
          echo "KUBE_CONTEXT=$CTX" >> "$GITHUB_ENV"

      - name: show what we are about to do
        run: |
          [ -n "${KUBE_CONTEXT:-}" ] && kubectl config use-context "$KUBE_CONTEXT"
          echo "cluster  ${{ inputs.cluster_name || 'unnamed' }}"
          echo "runner   ${{ inputs.runner_label }}"
          echo "env      ${{ inputs.environment }}"
          echo "profile  ${{ inputs.profile }}"
          echo "action   ${{ inputs.action }}"
          kubectl config current-context
          kubectl get nodes -o wide

      - name: credentials
        env:
          FAR_PULL_B64: ${{ secrets.FAR_PULL_B64 }}
        run: |
          [ -n "$FAR_PULL_B64" ] || { echo "FAR_PULL_B64 not set for bnk-${{ inputs.environment }}"; exit 1; }
          printf '%s' "$FAR_PULL_B64" > "$RUNNER_TEMP/far.json"
          chmod 600 "$RUNNER_TEMP/far.json"

      - name: plan first, always
        if: inputs.action == 'apply'
        env:
          FAR_PULL_JSON: ${{ runner.temp }}/far.json
        run: |
          ./install.sh --env ${{ inputs.environment }} --profile ${{ inputs.profile }} \
            --dry-run --skip-license

      - name: apply
        if: inputs.action == 'apply'
        env:
          FAR_PULL_JSON: ${{ runner.temp }}/far.json
          BNK_LICENSE_JWT: ${{ secrets.BNK_LICENSE_JWT }}
          BNK_STORAGECLASS: ${{ inputs.storage_class }}
          BNK_POD_CIDR: ${{ inputs.pod_cidr }}
        run: |
          ./install.sh --env ${{ inputs.environment }} --profile ${{ inputs.profile }} \
            ${{ inputs.skip_license && '--skip-license' || '' }}

      - name: verify only
        if: inputs.action == 'verify'
        env:
          FAR_PULL_JSON: ${{ runner.temp }}/far.json
        run: ./install.sh --env ${{ inputs.environment }} --phase 70

      - name: uninstall
        if: inputs.action == 'uninstall'
        run: ./uninstall.sh

      - name: diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide | grep -vE 'Running|Completed' || true
          kubectl get cneinstance -A -o jsonpath='{range .items[*].status.conditions[*]}{.type}={.status} {.message}{"\n"}{end}' || true
          kubectl logs -n f5-cne-core deploy/f5-lifecycle-operator --tail=60 || true

      - name: wipe credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/far.json" "$RUNNER_TEMP/kube"
