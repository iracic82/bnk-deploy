name: cluster-check

# Health of BNK across the fleet, run by the host that owns each cluster. Verification only, it
# changes nothing. Runs daily as a drift check and on demand.
#
# The fleet comes from clusters/*.yaml rather than being hardcoded here, so a cluster added in a
# pull request is checked from the next scheduled run onward with no workflow change.

on:
  workflow_dispatch:
    inputs:
      select:
        description: "Which clusters. all | env:production | profile:dpu | name:<cluster>"
        required: true
        default: "all"
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml
      - id: plan
        env:
          # a scheduled run checks everything enabled
          SELECT: ${{ inputs.select || 'all' }}
        run: python3 .github/scripts/plan_clusters.py

  check:
    needs: plan
    if: needs.plan.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/deploy.yml
    with:
      cluster_name: ${{ matrix.name }}
      runner_label: ${{ matrix.runner_label }}
      environment: ${{ matrix.environment }}
      profile: ${{ matrix.profile }}
      kube_context: ${{ matrix.kube_context }}
      storage_class: ${{ matrix.storage_class }}
      pod_cidr: ${{ matrix.pod_cidr }}
      action: verify
    secrets:
      FAR_PULL_B64: ${{ secrets.FAR_PULL_B64 }}
      BNK_LICENSE_JWT: ${{ secrets.BNK_LICENSE_JWT }}
      HUB_KUBECONFIGS: ${{ secrets.HUB_KUBECONFIGS }}
