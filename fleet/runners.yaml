# The runner fleet. One entry per self hosted runner, so the fleet is documented in git rather than
# only visible in the GitHub settings page.
#
# Register a host with:
#   GH_RUNNER_TOKEN=... ./bootstrap/install-runner.sh \
#     --repo OWNER/REPO --label <label> --env <env> --profile <host|dpu>
#
# Workflows address a runner by its label:
#   runs-on: [self-hosted, bnk, "<label>"]
#
# These are EXAMPLES matching clusters/. Replace them with your own.

runners:
  - label: lab-1
    description: Example. Development cluster, runner on the same host.
    environment: lab
    profile: host
    notes: Registered with --no-service, so it runs in the background rather than as a systemd
      unit and does not survive a reboot. Fine for a developer box, not for production.

  - label: prod-eu-west-1
    description: Example. Production cluster with BlueField, runner on the same host.
    environment: production
    profile: dpu

  - label: bnk-hub
    description: Example. Shared hub runner holding a merged kubeconfig for clusters that
      cannot host a runner of their own. Protect it like a jump host, it can reach all of them.
    environment: production
    profile: host
