# Three node cluster for testing node selection, taints and DaemonSet spread.
# Needs the host sysctls from the README, see "Testing on a multi node cluster".
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: bnk-multi
networking:
  disableDefaultCNI: true      # Calico is installed separately
  podSubnet: "192.168.0.0/16"
nodes:
  - role: control-plane
  - role: worker
  - role: worker
