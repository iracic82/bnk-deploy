# Development cluster on the Puget host, three node kind cluster with Calico.
# The runner lives on the same host, so no kubeconfig is stored anywhere.
name: lab-1
description: Development cluster, three nodes, software only. Used to validate changes.

runner: beside
runner_label: lab-1

environment: lab
profile: host

kube_context: kind-bnk-multi
storage_class: standard
pod_cidr: 192.168.0.0/16

enabled: true
