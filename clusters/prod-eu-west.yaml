# EXAMPLE. Copy, rename to your cluster, set enabled true.
#
# A production inference cluster with BlueField cards, runner on its own host so nothing
# reaches inbound.
name: prod-eu-west
description: Example. Production inference cluster, BlueField fitted.

runner: beside
runner_label: prod-eu-west-1

environment: production
profile: dpu

kube_context: prod-eu-west
storage_class: nfs
pod_cidr: 192.168.0.0/16

# Two DPU nodes. With the dpu profile the installer also taints them dpu=true:NoSchedule, which the
# DPU install path requires so only TMM and permitted system pods land on a DPU.
tmm:
  nodes: [dpu-1, dpu-2]
  manage_labels: true

enabled: false
